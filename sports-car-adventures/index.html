<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏎️ Sports Car Adventures — Slow Down</title>
<style>
  :root{
    --bg:#0d0f0c; --ink:#f2efe6; --muted:#a8a496; --accent:#d9a441;
    --line:rgba(217,164,65,.32); --card:#15170f;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#faf7ef; --ink:#23211b; --muted:#74705f; --accent:#a96f14;
           --line:rgba(169,111,20,.32); --card:#ffffff; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- sticky slim header ---- */
  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:10px;
    padding:10px 18px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    font-weight:700; font-size:15px; letter-spacing:.02em;
  }
  .topbar .ico{ font-size:20px; }
  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:34px 24px 40px;
  }
  /* the hills: one still image, arriving gently */
  .hills{
    width:min(1020px, 100%); border-radius:20px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(0,0,0,.28);
    animation:settle 2.4s ease both;
  }
  .hills img{ display:block; width:100%; height:auto; }
  @keyframes settle{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .hills{ animation:none; } }
  .hero{ max-width:640px; margin-top:38px; animation:settle 2.4s .3s ease both; }
  @media (prefers-reduced-motion: reduce){ .hero{ animation:none; } }
  .badge{
    display:inline-block; font-size:12.5px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--line); border-radius:999px;
    padding:8px 18px; margin-bottom:24px; font-weight:700;
    background:color-mix(in srgb, var(--accent) 8%, transparent);
  }
  h1{
    font-size:clamp(38px, 7.5vw, 62px); font-weight:800; letter-spacing:-.01em; line-height:1.04;
    margin-bottom:18px;
  }
  h1 .amber{ color:var(--accent); }
  p.lede{ font-size:clamp(16px, 2.6vw, 20px); color:var(--muted); line-height:1.65; max-width:48ch; margin:0 auto 8px; }
  p.tuned{ font-size:clamp(16px, 2.6vw, 20px); font-weight:600; margin-top:16px; }
  .footer{
    padding:22px; text-align:center; font-size:13px; color:var(--muted);
    border-top:1px solid var(--line);
  }
  .footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<header class="topbar"><span class="ico">🏎️</span><span>Sports Car Adventures</span></header>
<main>
  <figure class="hills">
    <img src="amador-hills.jpg" alt="Golden rolling hills and oak trees in Amador County, with a quiet country road winding through the valley at evening light">
  </figure>
  <div class="hero">
    <span class="badge">Sports Car Adventures</span>
    <h1>Slow <span class="amber">down.</span></h1>
    <p class="lede">Unhurried drives through the golden hills of Amador County. Good cars, quiet roads, and nowhere to be but here.</p>
    <p class="tuned">We're remodeling — taking our time with it. Stay tuned.</p>
  </div>
</main>
<footer class="footer">
  A <a href="https://davedellaquila.github.io/buddy-system/dellaquila-com/">dellaquila.com</a> brand
</footer>
</body>
</html>
