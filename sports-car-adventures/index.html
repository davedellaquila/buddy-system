<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏎️ Sports Car Adventures — Stay Tuned</title>
<style>
  :root{
    --bg:#0c0e12; --ink:#f4f1ea; --muted:#9aa0a8; --accent:#e8a33d;
    --line:rgba(232,163,61,.35); --card:#14171d;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#faf7f1; --ink:#1c1a17; --muted:#6f6a5e; --accent:#b3541e;
           --line:rgba(179,84,30,.35); --card:#ffffff; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- sticky slim header ---- */
  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:10px;
    padding:10px 18px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    font-weight:700; font-size:15px; letter-spacing:.02em;
  }
  .topbar .ico{ font-size:20px; }
  main{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 24px 32px; position:relative; overflow:hidden;
  }
  /* the road: a line that draws itself across the screen */
  .road{ position:absolute; left:0; right:0; top:50%; height:2px; pointer-events:none; }
  .road::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, var(--accent) 0 34px, transparent 34px 60px);
    opacity:.5; transform:translateY(-50%);
  }
  .road .car{
    position:absolute; top:0; font-size:30px; transform:translateY(-72%);
    animation:drive 9s linear infinite;
  }
  @keyframes drive{ from{ left:-8%; } to{ left:104%; } }
  @media (prefers-reduced-motion: reduce){ .road .car{ animation:none; left:46%; } }
  .hero{ position:relative; z-index:1; max-width:640px; }
  .badge{
    display:inline-block; font-size:13px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--line); border-radius:999px;
    padding:8px 18px; margin-bottom:26px; font-weight:700;
    background:color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .mark{ font-size:76px; line-height:1; margin-bottom:18px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
  h1{
    font-size:clamp(34px, 7vw, 58px); font-weight:800; letter-spacing:-.01em; line-height:1.05;
    margin-bottom:18px;
  }
  h1 .amber{ color:var(--accent); }
  p.lede{ font-size:clamp(16px, 2.6vw, 20px); color:var(--muted); line-height:1.6; max-width:46ch; margin:0 auto 8px; }
  p.tuned{ font-size:clamp(16px, 2.6vw, 20px); font-weight:600; margin-top:14px; }
  .footer{
    padding:22px; text-align:center; font-size:13px; color:var(--muted);
    border-top:1px solid var(--line);
  }
  .footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<header class="topbar"><span class="ico">🏎️</span><span>Sports Car Adventures</span></header>
<main>
  <div class="road" aria-hidden="true"><span class="car">🏎️</span></div>
  <div class="hero">
    <span class="badge">Under construction</span>
    <div class="mark">🏎️</div>
    <h1>Sports Car <span class="amber">Adventures</span></h1>
    <p class="lede">We're going through a bit of a remodeling — new paint, new roads, same love of the drive.</p>
    <p class="tuned">Stay tuned. Something fun is coming.</p>
  </div>
</main>
<footer class="footer">
  A <a href="https://davedellaquila.github.io/buddy-system/dellaquila-com/">dellaquila.com</a> brand
</footer>
</body>
</html>
