<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏎️ Sports Car Adventures — Slow Down</title>
<style>
  :root{
    --bg:#0d0f0c; --ink:#f2efe6; --muted:#a8a496; --accent:#d9a441;
    --line:rgba(217,164,65,.32); --card:#15170f;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#faf7ef; --ink:#23211b; --muted:#74705f; --accent:#a96f14;
           --line:rgba(169,111,20,.32); --card:#ffffff; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- sticky slim header ---- */
  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:10px;
    padding:10px 18px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    font-weight:700; font-size:15px; letter-spacing:.02em;
  }
  .topbar .ico{ font-size:20px; }
  main{
    flex:1; display:flex; flex-direction:column; align-items:center;
    text-align:center; padding:34px 24px 40px;
  }
  /* the hills: one still image, arriving gently */
  .hills{
    width:min(1020px, 100%); border-radius:20px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(0,0,0,.28);
    animation:settle 2.4s ease both;
  }
  .hills img{ display:block; width:100%; height:auto; }
  @keyframes settle{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .hills{ animation:none; } }
  .hero{ max-width:640px; margin-top:38px; animation:settle 2.4s .3s ease both; }
  @media (prefers-reduced-motion: reduce){ .hero{ animation:none; } }
  .badge{
    display:inline-block; font-size:12.5px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--line); border-radius:999px;
    padding:8px 18px; margin-bottom:24px; font-weight:700;
    background:color-mix(in srgb, var(--accent) 8%, transparent);
  }
  h1{
    font-size:clamp(38px, 7.5vw, 62px); font-weight:800; letter-spacing:-.01em; line-height:1.04;
    margin-bottom:18px;
  }
  h1 .amber{ color:var(--accent); }
  p.lede{ font-size:clamp(16px, 2.6vw, 20px); color:var(--muted); line-height:1.65; max-width:48ch; margin:0 auto 8px; }
  p.tuned{ font-size:clamp(16px, 2.6vw, 20px); font-weight:600; margin-top:16px; }
  .footer{
    padding:22px; text-align:center; font-size:13px; color:var(--muted);
    border-top:1px solid var(--line);
  }
  .footer a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .footer a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<header class="topbar"><span class="ico">🏎️</span><span>Sports Car Adventures</span></header>
<main>
  <figure class="hills">
    <img src="amador-hills.jpg" alt="Golden rolling hills and oak trees in Amador County, with a quiet country road winding through the valley at evening light">
  </figure>
  <div class="hero">
    <span class="badge">Sports Car Adventures</span>
    <h1>Slow <span class="amber">down.</span></h1>
    <p class="lede">Unhurried drives through the golden hills of Amador County. Good cars, quiet roads, and nowhere to be but here.</p>
    <p class="tuned">We're remodeling — taking our time with it. Stay tuned.</p>
  </div>
</main>
<footer class="footer">
  A <a href="https://davedellaquila.github.io/buddy-system/dellaquila-com/">dellaquila.com</a> brand
</footer>
<!--
  TIP JAR — canonical snippet (Dave's standard, 2026-10-24; motion v2, 2026-10-26)
  Every buddy homepage and every page a buddy creates carries the tip jar.
  Public pages especially: a reader who got value can say thanks.

  USAGE: paste this whole block just before </body>. No dependencies.
  The jar points at Dave's Ko-fi page by default. A page for a specific app
  may override the destination with its own Ko-fi page later:
      <div class="tipjar" ...> — change the href on the <a>.

  DESIGN NOTES (keep it alive, never annoying):
  - "Breathing" (v2): a calm but clearly visible pulse — the pill scales
    1 → 1.045 over a 3.2s ease-in-out cycle while its glow swells with it.
    (V1 breathed at 1.035 over 6s — Dave: "rather static." Too subtle.)
  - "Shimmer" (v2): a soft light sweep crosses the pill once every ~8s —
    a ~1.3s pass inside a long rest, built into the keyframe cycle.
  - Hover: the jar spins (same move as the dashboard sidebar's tip jar).
  - V1's hop + coin glint were retired in v2 — with the breathing and the
    shimmer running, the stack got busy; breathing + shimmer + hover spin
    is the trio now.
  - prefers-reduced-motion: all animation off. The jar is just a link.
  - Transform/opacity/box-shadow only — no layout shift.
  - Works in dark and light mode; sits above page content (z-index 60) but
    below modals on buddy pages.
-->
<style>
  .tipjar{position:fixed;right:18px;bottom:18px;z-index:60;
    font-family:inherit;-webkit-tap-highlight-color:transparent}
  .tipjar a{display:inline-flex;align-items:center;gap:.5em;position:relative;overflow:hidden;
    padding:.55em 1em;border-radius:999px;text-decoration:none;
    font-size:.9rem;font-weight:600;line-height:1;
    color:#fff;background:linear-gradient(135deg,#7c4dff,#b388ff);
    box-shadow:0 6px 18px rgba(124,77,255,.35),0 2px 6px rgba(0,0,0,.25);
    animation:tipjar-breathe 3.2s ease-in-out infinite}
  .tipjar a::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 65%);
    transform:translateX(-110%);animation:tipjar-sheen 8s ease-in-out infinite}
  .tipjar .jar{display:inline-block;font-size:1.15em}
  .tipjar a:hover .jar{animation:tipjar-spin .7s cubic-bezier(.34,1.56,.64,1)}
  .tipjar a:focus-visible{outline:3px solid #ffd54f;outline-offset:3px}
  @keyframes tipjar-breathe{0%,100%{transform:scale(1);box-shadow:0 6px 18px rgba(124,77,255,.35),0 2px 6px rgba(0,0,0,.25)}50%{transform:scale(1.045);box-shadow:0 9px 26px rgba(124,77,255,.55),0 3px 8px rgba(0,0,0,.28)}}
  @keyframes tipjar-sheen{0%{transform:translateX(-110%)}16%{transform:translateX(110%)}100%{transform:translateX(110%)}}
  @keyframes tipjar-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){
    .tipjar a,.tipjar a:hover .jar{animation:none}
    .tipjar a::after{display:none}
  }
</style>
<div class="tipjar">
  <a href="https://ko-fi.com/davedellaquila" target="_blank" rel="noopener"
     aria-label="Tip jar — if this page helped you, you can leave Dave a tip on Ko-fi">
    <span class="jar">🫙</span><span class="tiptext">Tip Jar</span>
  </a>
</div>
</body>
</html>
