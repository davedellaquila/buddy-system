<!--
  TIP JAR — canonical snippet (Dave's standard, 2026-10-24; motion v2, 2026-10-26;
  HEADER placement, 2026-10-28 — supersedes the floating pill)

  Every buddy homepage and every page a buddy creates carries the tip jar.
  Public pages especially: a reader who got value can say thanks.

  PLACEMENT (2026-10-28): the jar is a compact bug that lives IN the page's
  header row (sticky header / topbar), at its right end — modelled first on
  Developer Buddy's homepage, which is the reference implementation. The
  old floating bottom-right pill is retired.

  USAGE: put the <style> block in <head> and the <a class="header-tip">
  element inside the page's header/topbar, as its last item (in a flex
  header, margin-left:auto pushes it to the right end — the generators add
  that rule for their own headers). Generated pages (gen_basic_homepages.py
  template homepages, gen_default_homepages.py About/default pages) get
  both pieces automatically from this file — never hand-edit them in.

  The jar points at Dave's Ko-fi page by default. A page for a specific app
  may override the destination with its own Ko-fi page later: change the
  href on the <a>.

  DESIGN NOTES (keep it alive, never annoying):
  - "Breathing" (v2): the pill scales 1 → 1.045 over a 3.2s ease-in-out
    cycle while its glow swells with it. (V1 breathed ±2px over 6s —
    Dave: "rather static." Too subtle.)
  - "Shimmer" (v2): a soft light sweep crosses the pill once every ~8s.
  - Hover: the jar emoji spins.
  - prefers-reduced-motion: all animation off. The jar is just a link.
  - Transform/opacity/box-shadow only — no layout shift.
-->
<style>
.header-tip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.45em;padding:6px 12px;border-radius:999px;text-decoration:none;
  font-size:13px;font-weight:800;line-height:1;color:#fff;background:linear-gradient(135deg,#7c4dff,#b388ff);
  box-shadow:0 4px 14px rgba(124,77,255,.35);animation:tip-breathe 3.2s ease-in-out infinite;white-space:nowrap}
.header-tip::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.45) 50%,rgba(255,255,255,0) 65%);
  transform:translateX(-110%);animation:tip-sheen 8s ease-in-out infinite}
.header-tip .jar{display:inline-block;font-size:1.1em}
.header-tip:hover .jar{animation:tip-spin .7s cubic-bezier(.34,1.56,.64,1)}
.header-tip:focus-visible{outline:3px solid #ffd54f;outline-offset:3px}
@keyframes tip-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes tip-sheen{0%{transform:translateX(-110%)}16%{transform:translateX(110%)}100%{transform:translateX(110%)}}
@keyframes tip-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .header-tip,.header-tip:hover .jar{animation:none}
  .header-tip::after{display:none}
}
</style>
<a class="header-tip" href="https://ko-fi.com/davedellaquila" target="_blank" rel="noopener" aria-label="Tip Jar — if this page helped you, you can leave Dave a tip on Ko-fi"><span class="jar" aria-hidden="true">🫙</span><span>Tip Jar</span></a>
