<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome-card snippet — reference for buddy threads</title>
</head>
<body>
<!--
  WELCOME-CARD SNIPPET — integration reference (Jonny, 2026-10-15)
  ================================================================
  Dave wants a welcome card on every buddy homepage/app: what this is,
  why it matters, one thing to try, dismissible. Apple card language.

  WHAT IT DOES
  A centered card (max 400px): 96px icon squircle, buddy name, one-line
  why-it-matters, a tinted "Try this" well, and a full-width "Got it"
  button (+ quiet × top-right). Appears on first visit only, in-flow at
  the top of content — never an overlay. Dismissal remembered per device
  per buddy via localStorage. Entrance: fade + 14px rise, 450ms.

  INTEGRATION
  1. Paste the CSS into your <style>, the HTML where you want the card
     (top of main content), the JS before </body>.
  2. Set data-buddy-id, data-icon, data-name, data-why, data-try on the
     section element.
  3. Copy contract: name ≤ 24 chars, why ≤ 140 chars, try ≤ 40 chars.
  4. Dark AND light mode must both work (uses prefers-color-scheme).

  Replace __BID__ with the buddy id, __ICON__ with the emoji,
  __NAME__ with the buddy name, __WHY__ with the why line,
  __TRY__ with the try-this text.
-->

<style>
/* ---- welcome-card CSS (Jonny, 2026-10-15 — Apple card language) ---- */
.wcard-wrap { display: flex; justify-content: center; padding: 8px 16px 24px; }
.wcard {
  position: relative; max-width: 400px; width: 100%;
  padding: 36px 30px 30px; border-radius: 24px; text-align: center;
  background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 18px 48px rgba(0,0,0,.12);
  opacity: 0; transform: translateY(14px);
  transition: opacity .45s cubic-bezier(.32,.72,0,1), transform .45s cubic-bezier(.32,.72,0,1);
}
.wcard.wcard-in { opacity: 1; transform: translateY(0); }
.wcard.wcard-out { opacity: 0; transform: scale(.97); transition: opacity .25s, transform .25s; }
.wcard-icon {
  width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 24px;
  background: #F2F2F7; display: flex; align-items: center; justify-content: center;
  font-size: 56px; line-height: 1;
}
.wcard h2 { margin: 0 0 10px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.wcard-why { margin: 0 0 18px; font-size: 16px; line-height: 1.55; color: #6B6B70; }
.wcard-try {
  margin: 0 0 20px; padding: 14px 16px; border-radius: 14px;
  background: rgba(0,122,255,.09); font-size: 15px; line-height: 1.5; color: #1C1C1E;
}
.wcard-try strong { font-weight: 700; }
.wcard-btn {
  width: 100%; height: 52px; border: none; border-radius: 14px;
  background: #007AFF; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
}
.wcard-btn:active { opacity: .85; }
.wcard-x {
  position: absolute; top: 8px; right: 8px; width: 44px; height: 44px;
  border: none; background: transparent; color: #AEAEB2; font-size: 22px;
  cursor: pointer; border-radius: 50%;
}
.wcard-x:hover { color: #6B6B70; }
@media (prefers-color-scheme: dark) {
  .wcard { background: #1C1C1E; box-shadow: 0 18px 48px rgba(0,0,0,.6); }
  .wcard-icon { background: #2C2C2E; }
  .wcard h2 { color: #FFFFFF; }
  .wcard-why { color: #AEAEB2; }
  .wcard-try { background: rgba(10,132,255,.16); color: #F2F2F7; }
  .wcard-btn { background: #0A84FF; }
  .wcard-x { color: #636366; }
  .wcard-x:hover { color: #AEAEB2; }
}
</style>

<!-- ---- welcome-card HTML (set data-* attributes) ---- -->
<div class="wcard-wrap" data-wcard data-buddy-id="__BID__" hidden>
  <div class="wcard" role="dialog" aria-label="Welcome to __NAME__">
    <button class="wcard-x" type="button" aria-label="Dismiss">×</button>
    <div class="wcard-icon">__ICON__</div>
    <h2>__NAME__</h2>
    <p class="wcard-why">__WHY__</p>
    <p class="wcard-try">✨ <strong>Try this:</strong> __TRY__</p>
    <button class="wcard-btn" type="button">Got it</button>
  </div>
</div>

<script>
// ---- welcome-card JS (self-contained; no dependencies) ----
(function(){
  var wrap = document.querySelector('[data-wcard]');
  if (!wrap || wrap.dataset.wcardInit) return;
  wrap.dataset.wcardInit = '1';
  var bid = wrap.getAttribute('data-buddy-id') || 'welcome';
  var key = 'wcard.dismissed.' + bid;
  try { if (localStorage.getItem(key)) return; } catch(e){}
  var card = wrap.querySelector('.wcard');
  wrap.hidden = false;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    card.classList.add('wcard-in');
  }); });
  function dismiss(){
    card.classList.remove('wcard-in');
    card.classList.add('wcard-out');
    try { localStorage.setItem(key, '1'); } catch(e){}
    setTimeout(function(){ wrap.hidden = true; }, 260);
  }
  wrap.querySelector('.wcard-btn').addEventListener('click', dismiss);
  wrap.querySelector('.wcard-x').addEventListener('click', dismiss);
})();
</script>
</body>
</html>
